# Continuous integration and deployment.
# - On every pull request: checks that the project still builds.
# - On every push to master: same checks, then deploys to the server if they pass.
# Results appear in the "Actions" tab of the GitHub repository.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Job 1: install dependencies and build every package
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install pnpm (version taken from "packageManager" in package.json)
        uses: pnpm/action-setup@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm # reuses downloaded packages between runs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # fails if pnpm-lock.yaml is out of date

      - name: Build shared
        run: pnpm --filter @word-guesser/shared build

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build frontend
        # build-only skips the type-check, which currently fails.
        # Switch to "build" once the type errors are fixed.
        run: pnpm --filter frontend build-only

  # Job 2: check that the production Docker images still build (nothing is published)
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target prod -f packages/backend/Dockerfile .

      - name: Build frontend image
        run: docker build --target prod -f packages/frontend/Dockerfile .

  # Job 3: deploy to the server (see docs/deployment.md)
  deploy:
    needs: [build, docker] # only runs if both checks pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: # one deployment at a time, never cancelled halfway
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Set up the SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # tr removes Windows line endings that copy-pasting can add to secrets
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          echo "Server key expected by this job:"
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Deploy
        # The key is restricted on the server to a single command
        # (git pull + docker compose up), so no command is sent here.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -T -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST"
