# Production stack: built images, no source mounts.
# Only Caddy publishes ports. Docker bypasses the server firewall (ufw)
# for published ports, so backend and frontend must not publish any.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # HTTPS certificates
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: prod
    env_file: packages/backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: prod
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
