# Development stack: hot reload on mounted sources.
# Changes to packages/shared or to dependencies need a rebuild (make start-build).

services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: dev
    # -L: polling, file events from the Windows host don't reach the container
    command: pnpm exec nodemon -L --watch src --exec tsx src/index.ts
    env_file: packages/backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ./packages/backend:/app/packages/backend
      - /app/packages/backend/node_modules
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: dev
    environment:
      VITE_WEB_SOCKET_URL: ws://localhost:3000
      VITE_USE_POLLING: "true"
    volumes:
      - ./packages/frontend:/app/packages/frontend
      - /app/packages/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
